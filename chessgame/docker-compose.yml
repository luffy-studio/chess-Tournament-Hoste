version: '3.8'

services:
  chess-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: royal-chess-platform
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - JWT_SECRET=${JWT_SECRET:-royal-chess-secret-change-in-production}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:5000,http://localhost:5173}
      - ALLOW_LAN_CORS=true
    volumes:
      - chess-data:/app/backend/prisma
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5000/api/health/live').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  chess-data:
    driver: local
